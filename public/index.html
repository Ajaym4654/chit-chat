<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f8fafc"
  >

  <meta
    name="description"
    content="Anon Fun Chat - Anonymous group chat with GIFs, emojis, voice messages, files and shared YouTube music."
  >

  <title>Anon Fun Chat</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="icon"
    href="data:;base64,iVBORw0KGgo="
  >

  <style>

    /* =================================================
       YOUTUBE PANEL
    ================================================= */

.youtube-panel {
  position: fixed;

  right: 20px;
  bottom: 90px;

  width: 720px;
  max-width: calc(100vw - 30px);

  background: rgba(255, 255, 255, 0.97);

  border: 1px solid #e2e8f0;

  border-radius: 16px;

  box-shadow:
    0 18px 45px rgba(15, 23, 42, 0.18);

  overflow: hidden;

  z-index: 1000;

  display: none;
}

.youtube-panel.open {
  display: block;
}


/* =================================================
   DRAGGABLE HEADER
================================================= */

.youtube-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  padding: 10px 12px;

  border-bottom: 1px solid #e2e8f0;

  cursor: grab;

  user-select: none;

  touch-action: none;

  background: #fffafa;
}

.youtube-header:active {
  cursor: grabbing;
}

.youtube-header-title {
  font-weight: 800;

  font-size: 15px;

  color: #991b1b;

  min-width: 0;
}


/* CLOSE BUTTON */

.youtube-close {
  border: 0;

  background: transparent;

  cursor: pointer;

  font-size: 20px;

  padding: 3px 8px;

  color: #991b1b;

  font-weight: 700;
}

.youtube-close:hover {
  color: #dc2626;
}


/* =================================================
   YOUTUBE MAIN CONTENT
   PLAYER LEFT + SEARCH RIGHT
================================================= */

.youtube-content {
  display: grid;

  grid-template-columns: minmax(0, 1fr) 280px;

  min-height: 400px;
}


/* =================================================
   LEFT SIDE - PLAYER
================================================= */

.youtube-player-section {
  min-width: 0;

  border-right: 1px solid #e2e8f0;
}

#youtubePlayer {
  width: 100%;

  aspect-ratio: 16 / 9;

  background: #000;

  display: block;
}

.youtube-title {
  padding: 10px 14px 3px;

  font-size: 14px;

  font-weight: 700;

  color: #991b1b;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.youtube-status {
  padding: 4px 14px 12px;

  font-size: 12px;

  color: #64748b;
}


/* =================================================
   RIGHT SIDE - YOUTUBE SEARCH
================================================= */

.youtube-search-box {
  padding: 10px;

  border-bottom: 1px solid #e2e8f0;

  background: #fffafa;
}

.youtube-search-label {
  display: block;

  font-size: 12px;

  font-weight: 800;

  color: #991b1b;

  margin-bottom: 7px;
}

.youtube-search-row {
  display: flex;

  gap: 7px;
}

.youtube-search-row input {
  flex: 1;

  min-width: 0;

  padding: 9px 10px;

  border: 1px solid #fecaca;

  border-radius: 9px;

  outline: none;

  font-size: 13px;

  color: #7f1d1d;

  background: #fff;
}

.youtube-search-row input:focus {
  border-color: #dc2626;

  box-shadow:
    0 0 0 3px rgba(220, 38, 38, 0.12);
}

.youtube-search-row input::placeholder {
  color: #b91c1c;
  opacity: 0.65;
}

.youtube-search-row button {
  border: 0;

  border-radius: 9px;

  padding: 9px 12px;

  cursor: pointer;

  background: #991b1b;

  color: white;

  font-weight: 700;
}

.youtube-search-row button:hover {
  background: #dc2626;
}


/* =================================================
   YOUTUBE RESULTS
================================================= */

.youtube-results {
  max-height: 320px;

  overflow-y: auto;

  padding: 7px;

  background: #fff;
}

.youtube-result {
  width: 100%;

  display: flex;

  gap: 9px;

  text-align: left;

  border: 0;

  background: transparent;

  padding: 7px;

  border-radius: 9px;

  cursor: pointer;
}

.youtube-result:hover {
  background: #fff1f2;
}

.youtube-result img {
  width: 92px;

  height: 55px;

  object-fit: cover;

  border-radius: 7px;

  flex-shrink: 0;
}

.youtube-result-info {
  min-width: 0;
}

.youtube-result-title {
  font-size: 12px;

  font-weight: 700;

  color: #7f1d1d;

  line-height: 1.35;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.youtube-result-channel {
  margin-top: 4px;

  font-size: 10px;

  color: #b91c1c;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.youtube-loading {
  text-align: center;

  padding: 18px 8px;

  color: #991b1b;

  font-size: 12px;

  font-weight: 600;
}


/* =================================================
   SCROLLBAR
================================================= */

.youtube-results::-webkit-scrollbar {
  width: 6px;
}

.youtube-results::-webkit-scrollbar-track {
  background: #fff;
}

.youtube-results::-webkit-scrollbar-thumb {
  background: #fca5a5;

  border-radius: 10px;
}


/* =================================================
   MOBILE
   SEARCH AUTOMATICALLY GOES BELOW PLAYER
================================================= */

@media (max-width: 640px) {

  .youtube-panel {
    right: 10px;
    bottom: 80px;

    width: calc(100vw - 20px);

    max-height: calc(100vh - 100px);
  }

  .youtube-content {
    display: flex;

    flex-direction: column;

    min-height: 0;
  }

  .youtube-player-section {
    border-right: 0;

    border-bottom: 1px solid #e2e8f0;
  }

  .youtube-results {
    max-height: 220px;
  }

  .youtube-header {
    cursor: default;
  }
}
  </style>

</head>


<body>


  <!-- ==========================================
       BACKGROUND
  =========================================== -->

  <div
    class="background-shapes"
    aria-hidden="true"
  >

    <span class="circle circle-1"></span>

    <span class="circle circle-2"></span>

    <span class="circle circle-3"></span>

    <span class="circle circle-4"></span>

    <span class="circle circle-5"></span>

    <span class="circle circle-6"></span>

  </div>


  <!-- ==========================================
       APP
  =========================================== -->

  <div class="app">


    <!-- ========================================
         HEADER
    ========================================= -->

    <header>

      <div class="title">
        💬 Anon Fun Chat
      </div>


      <div class="header-right">

        <div class="meta">

          <span class="live-dot"></span>

          <span>
            Live — Nothing is saved
          </span>

        </div>


        <div
          class="user-stats"
          aria-label="User statistics"
        >

          <span>

            🟢

            <strong id="liveUsers">
              0
            </strong>

            Live

          </span>


          <span>

            👥

            <strong id="totalUsers">
              0
            </strong>

            Total

          </span>

        </div>

      </div>

    </header>


    <!-- ========================================
         CHAT AREA
    ========================================= -->

    <main
      id="chatArea"
      aria-live="polite"
      aria-label="Group chat messages"
    ></main>


    <!-- ========================================
         CONTROLS
    ========================================= -->

    <form
      id="controls"
      autocomplete="off"
    >


      <!-- NAME ROW -->

      <div class="row name-row">

        <input
          id="name"
          type="text"
          placeholder="Name (optional)"
          maxlength="20"
          autocomplete="off"
        >


        <!-- EMOJI PICKER -->

        <div
          class="emoji-picker"
          id="emojiPicker"
          aria-hidden="true"
        ></div>


        <!-- GIF PICKER -->

        <div
          id="gifPicker"
          class="gif-picker"
        >

          <div class="gif-search">

            <input
              id="gifSearch"
              type="text"
              placeholder="Search GIFs..."
              autocomplete="off"
              maxlength="100"
              aria-label="Search GIFs"
            >

            <button
              type="button"
              id="gifSearchBtn"
            >
              Search
            </button>

          </div>


          <div
            id="gifResults"
            class="gif-results"
            aria-live="polite"
          ></div>

        </div>

      </div>


      <!-- MESSAGE ROW -->

      <div class="row message-row">

        <textarea
          id="msg"
          rows="1"
          placeholder="Type a message… (press Enter to send)"
          maxlength="2000"
          autocomplete="off"
        ></textarea>


        <!-- EMOJI -->

        <button
          type="button"
          id="emojiBtn"
          title="Emoji"
          aria-label="Emoji"
        >
          😊
        </button>


        <!-- GIF -->

        <button
          type="button"
          id="gifBtn"
          class="gif-btn"
          title="GIF"
          aria-label="GIF"
        >
          GIF
        </button>


        <!-- VOICE -->

        <button
          type="button"
          id="voiceBtn"
          title="Voice message"
          aria-label="Voice message"
        >
          🎤
        </button>


        <!-- FILE -->

        <label
          class="fileLabel"
          title="Send a file"
          aria-label="Attach file"
        >

          📎

          <input
            id="fileInput"
            type="file"
            accept="image/*,audio/*,.pdf,.doc,.docx,.txt"
            hidden
          >

        </label>


        <!-- SEND -->

        <button
          id="sendBtn"
          class="send"
          type="submit"
        >
          Send
        </button>

      </div>


      <!-- FILE QUEUE -->

      <div
        id="fileQueue"
        class="file-queue"
        aria-live="polite"
      ></div>


      <!-- ======================================
           YOUTUBE SEARCH
      ======================================= -->

      <div class="youtube-search-box">

        <div class="youtube-search-row">

          <input
            id="youtubeSearch"
            type="text"
            placeholder="🎵 Search YouTube songs..."
            maxlength="100"
            autocomplete="off"
          >

          <button
            type="button"
            id="youtubeSearchBtn"
          >
            Search
          </button>

        </div>


        <div
          id="youtubeResults"
          class="youtube-results"
        ></div>

      </div>


    </form>


    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer>

      <small>

        For fun only · No accounts · No history ·
        Files auto-expire · Be nice ✨

      </small>

    </footer>


  </div>


  <!-- ==========================================
       YOUTUBE PLAYER
  =========================================== -->

  <aside
    id="youtubePlayerPanel"
    class="youtube-panel"
  >

    <div class="youtube-header">

      <div class="youtube-header-title">
        🎵 Shared Music
      </div>

      <button
        type="button"
        id="youtubeCloseBtn"
        class="youtube-close"
        title="Stop music"
        aria-label="Stop music"
      >
        ✕
      </button>

    </div>


    <div
      id="youtubePlayer"
    ></div>


    <div
      id="youtubePlayerTitle"
      class="youtube-title"
    >
      No song selected
    </div>


    <div
      id="youtubeStatus"
      class="youtube-status"
    >
      Ready
    </div>

  </aside>


  <!-- ==========================================
       SOCKET.IO
  =========================================== -->

  <script
    src="/socket.io/socket.io.js"
  ></script>


  <!-- ==========================================
       CLIENT JS
  =========================================== -->

  <script
    src="client.js"
  ></script>


</body>

</html>
