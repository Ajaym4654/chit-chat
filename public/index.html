<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f8fafc"
  >

  <meta
    name="description"
    content="Anon Fun Chat - Anonymous group chat with GIFs, emojis, voice messages, files and shared YouTube music."
  >

  <title>Anon Fun Chat</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="icon"
    href="data:;base64,iVBORw0KGgo="
  >

  <style>

    /* =================================================
       YOUTUBE PANEL
    ================================================= */

    .youtube-panel {

      position: fixed;

      right: 20px;

      bottom: 90px;

      width: 330px;

      max-width: calc(100vw - 30px);

      background: rgba(255,255,255,.97);

      border: 1px solid #e2e8f0;

      border-radius: 16px;

      box-shadow:
        0 18px 45px rgba(15,23,42,.18);

      overflow: hidden;

      z-index: 1000;

      display: none;

    }


    .youtube-panel.open {

      display: block;

    }


    .youtube-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 10px 12px;

      border-bottom: 1px solid #e2e8f0;

    }


    .youtube-header-title {

      font-weight: 700;

      font-size: 14px;

      min-width: 0;

    }


    .youtube-close {

      border: 0;

      background: transparent;

      cursor: pointer;

      font-size: 18px;

      padding: 3px 7px;

    }


    #youtubePlayer {

      width: 100%;

      background: #000;

    }


    .youtube-title {

      padding: 8px 12px 2px;

      font-size: 13px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .youtube-status {

      padding: 3px 12px 9px;

      font-size: 11px;

      color: #64748b;

    }


    /* =================================================
       YOUTUBE SEARCH
    ================================================= */

    .youtube-search-box {

      padding: 10px;

      border-bottom: 1px solid #e2e8f0;

    }


    .youtube-search-row {

      display: flex;

      gap: 7px;

    }


    .youtube-search-row input {

      flex: 1;

      min-width: 0;

      padding: 9px 10px;

      border: 1px solid #cbd5e1;

      border-radius: 9px;

      outline: none;

      font-size: 13px;

    }


    .youtube-search-row button {

      border: 0;

      border-radius: 9px;

      padding: 9px 12px;

      cursor: pointer;

      background: #ef4444;

      color: white;

      font-weight: 600;

    }


    .youtube-results {

      max-height: 260px;

      overflow-y: auto;

      padding: 7px;

    }


    .youtube-result {

      width: 100%;

      display: flex;

      gap: 9px;

      text-align: left;

      border: 0;

      background: transparent;

      padding: 7px;

      border-radius: 9px;

      cursor: pointer;

    }


    .youtube-result:hover {

      background: #f1f5f9;

    }


    .youtube-result img {

      width: 92px;

      height: 55px;

      object-fit: cover;

      border-radius: 7px;

      flex-shrink: 0;

    }


    .youtube-result-info {

      min-width: 0;

    }


    .youtube-result-title {

      font-size: 12px;

      font-weight: 600;

      line-height: 1.35;

      display: -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

      overflow: hidden;

    }


    .youtube-result-channel {

      margin-top: 4px;

      font-size: 10px;

      color: #64748b;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .youtube-loading {

      text-align: center;

      padding: 18px 8px;

      color: #64748b;

      font-size: 12px;

    }


    /* =================================================
       MOBILE
    ================================================= */

    @media (max-width: 640px) {

      .youtube-panel {

        right: 10px;

        bottom: 80px;

        width: calc(100vw - 20px);

      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       BACKGROUND
  =========================================== -->

  <div
    class="background-shapes"
    aria-hidden="true"
  >

    <span class="circle circle-1"></span>

    <span class="circle circle-2"></span>

    <span class="circle circle-3"></span>

    <span class="circle circle-4"></span>

    <span class="circle circle-5"></span>

    <span class="circle circle-6"></span>

  </div>


  <!-- ==========================================
       APP
  =========================================== -->

  <div class="app">


    <!-- ========================================
         HEADER
    ========================================= -->

    <header>

      <div class="title">
        💬 Anon Fun Chat
      </div>


      <div class="header-right">

        <div class="meta">

          <span class="live-dot"></span>

          <span>
            Live — Nothing is saved
          </span>

        </div>


        <div
          class="user-stats"
          aria-label="User statistics"
        >

          <span>

            🟢

            <strong id="liveUsers">
              0
            </strong>

            Live

          </span>


          <span>

            👥

            <strong id="totalUsers">
              0
            </strong>

            Total

          </span>

        </div>

      </div>

    </header>


    <!-- ========================================
         CHAT AREA
    ========================================= -->

    <main
      id="chatArea"
      aria-live="polite"
      aria-label="Group chat messages"
    ></main>


    <!-- ========================================
         CONTROLS
    ========================================= -->

    <form
      id="controls"
      autocomplete="off"
    >


      <!-- NAME ROW -->

      <div class="row name-row">

        <input
          id="name"
          type="text"
          placeholder="Name (optional)"
          maxlength="20"
          autocomplete="off"
        >


        <!-- EMOJI PICKER -->

        <div
          class="emoji-picker"
          id="emojiPicker"
          aria-hidden="true"
        ></div>


        <!-- GIF PICKER -->

        <div
          id="gifPicker"
          class="gif-picker"
        >

          <div class="gif-search">

            <input
              id="gifSearch"
              type="text"
              placeholder="Search GIFs..."
              autocomplete="off"
              maxlength="100"
              aria-label="Search GIFs"
            >

            <button
              type="button"
              id="gifSearchBtn"
            >
              Search
            </button>

          </div>


          <div
            id="gifResults"
            class="gif-results"
            aria-live="polite"
          ></div>

        </div>

      </div>


      <!-- MESSAGE ROW -->

      <div class="row message-row">

        <textarea
          id="msg"
          rows="1"
          placeholder="Type a message… (press Enter to send)"
          maxlength="2000"
          autocomplete="off"
        ></textarea>


        <!-- EMOJI -->

        <button
          type="button"
          id="emojiBtn"
          title="Emoji"
          aria-label="Emoji"
        >
          😊
        </button>


        <!-- GIF -->

        <button
          type="button"
          id="gifBtn"
          class="gif-btn"
          title="GIF"
          aria-label="GIF"
        >
          GIF
        </button>


        <!-- VOICE -->

        <button
          type="button"
          id="voiceBtn"
          title="Voice message"
          aria-label="Voice message"
        >
          🎤
        </button>


        <!-- FILE -->

        <label
          class="fileLabel"
          title="Send a file"
          aria-label="Attach file"
        >

          📎

          <input
            id="fileInput"
            type="file"
            accept="image/*,audio/*,.pdf,.doc,.docx,.txt"
            hidden
          >

        </label>


        <!-- SEND -->

        <button
          id="sendBtn"
          class="send"
          type="submit"
        >
          Send
        </button>

      </div>


      <!-- FILE QUEUE -->

      <div
        id="fileQueue"
        class="file-queue"
        aria-live="polite"
      ></div>


      <!-- ======================================
           YOUTUBE SEARCH
      ======================================= -->

      <div class="youtube-search-box">

        <div class="youtube-search-row">

          <input
            id="youtubeSearch"
            type="text"
            placeholder="🎵 Search YouTube songs..."
            maxlength="100"
            autocomplete="off"
          >

          <button
            type="button"
            id="youtubeSearchBtn"
          >
            Search
          </button>

        </div>


        <div
          id="youtubeResults"
          class="youtube-results"
        ></div>

      </div>


    </form>


    <!-- ========================================
         FOOTER
    ========================================= -->

    <footer>

      <small>

        For fun only · No accounts · No history ·
        Files auto-expire · Be nice ✨

      </small>

    </footer>


  </div>


  <!-- ==========================================
       YOUTUBE PLAYER
  =========================================== -->

  <aside
    id="youtubePlayerPanel"
    class="youtube-panel"
  >

    <div class="youtube-header">

      <div class="youtube-header-title">
        🎵 Shared Music
      </div>

      <button
        type="button"
        id="youtubeCloseBtn"
        class="youtube-close"
        title="Stop music"
        aria-label="Stop music"
      >
        ✕
      </button>

    </div>


    <div
      id="youtubePlayer"
    ></div>


    <div
      id="youtubePlayerTitle"
      class="youtube-title"
    >
      No song selected
    </div>


    <div
      id="youtubeStatus"
      class="youtube-status"
    >
      Ready
    </div>

  </aside>


  <!-- ==========================================
       SOCKET.IO
  =========================================== -->

  <script
    src="/socket.io/socket.io.js"
  ></script>


  <!-- ==========================================
       CLIENT JS
  =========================================== -->

  <script
    src="client.js"
  ></script>


</body>

</html>
